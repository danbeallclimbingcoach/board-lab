<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TB2 Light</title>
<style>
/* One column, thumb-reachable controls pinned to the bottom. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --panel:#e9ece8; --line:#cdd3cc; --fg:#1b221e; --muted:#5b6660;
  --accent:#1f6f5c; --accent-ink:#fff; --warn:#a4570e; --err:#b3261e;
  --start:#00b800; --hand:#2f55ff; --finish:#e00000; --foot:#d000d0; --dot:#9aa49d;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121715; --surface:#1b211e; --panel:#232b27; --line:#34403a; --fg:#e7ece8; --muted:#9aa79f;
  --accent:#4fbf9f; --accent-ink:#0c1512; --warn:#f0a85a; --err:#ff8a80;
  --start:#33dd33; --hand:#6f8bff; --finish:#ff4d4d; --foot:#ff55ff; --dot:#55615a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--body)}
body{padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.01em;flex:1}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45}
.status{font:12px var(--mono);color:var(--muted);width:100%}
.status.err{color:var(--err)} .status.ok{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
select{font:15px var(--body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%;flex:1;min-width:0}
label.small{font-size:13px;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:6px}
.board svg{display:block;width:100%;height:auto;max-height:46vh}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.climb{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--fg);font:inherit;cursor:pointer}
.climb .n{font:12px var(--mono);color:var(--muted);grid-row:span 2}
.climb .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.climb .g{font:600 13px var(--mono);text-align:right}
.climb .m{font-size:12px;color:var(--muted);grid-column:2 / span 2}
.climb[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.climb.lit .n{color:var(--accent)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.dock .cur{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.dock .cur small{font-weight:400;color:var(--muted)}
.dock .ctl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);justify-content:center;margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--c);margin-right:4px;vertical-align:-1px}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>TB2 Light</h1>
  <button class="btn" id="clearBtn" disabled>Clear</button>
  <button class="btn primary" id="connectBtn">Connect board</button>
  <div class="status" id="status">Not connected.</div>
</header>

<div class="warn" id="noBle" hidden>This browser can't use Bluetooth. On iPhone open this page in <b>Bluefy</b>; on Android or a laptop use <b>Chrome</b>.</div>

<div class="row">
  <label class="small" for="layout">My board</label>
  <select id="layout" style="flex:0 1 auto">
    <option value="mirror">TB2 Mirror · 12×12</option>
    <option value="spray">TB2 Spray · 12×12</option>
  </select>
</div>
<div class="row"><select id="listSel" aria-label="List"></select></div>
<div class="warn" id="layoutWarn" hidden>This list is for the other layout. Lighting it on your board would show the wrong holds, so the Light button is off.</div>

<div class="board">
  <svg id="map" viewBox="-72 -4 144 152" role="img" aria-label="Holds of the selected climb"></svg>
  <div class="legend">
    <span><i style="--c:var(--start)"></i>Start</span><span><i style="--c:var(--hand)"></i>Hand</span>
    <span><i style="--c:var(--finish)"></i>Finish</span><span><i style="--c:var(--foot)"></i>Foot</span>
  </div>
</div>

<div class="list" id="list"></div>

<div class="dock">
  <div class="cur" id="cur">Pick a climb</div>
  <div class="ctl">
    <button class="btn" id="prevBtn">‹ Prev</button>
    <button class="btn primary" id="lightBtn" disabled>Light</button>
    <button class="btn" id="nextBtn">Next ›</button>
  </div>
</div>

<script>
// Aurora LED protocol encoder (Tension Board 2), after Boardsesh's
// docs/AURORA_BLUETOOTH_PROTOCOL_SPEC.md (Apache-2.0). Pure functions, no Bluetooth.
const AURORA = (() => {
  const CMD = { 2: { single: 80, start: 78, cont: 77, end: 79 }, 3: { single: 84, start: 82, cont: 81, end: 83 } };
  const hex = (h) => [0, 2, 4].map((i) => parseInt(h.replace("#", "").slice(i, i + 2), 16));

  function checksum(payload) {
    let t = 0;
    for (const b of payload) t = (t + b) & 0xff;
    return ~t & 0xff;
  }
  function wrap(payload) {
    return [0x01, payload.length, checksum(payload), 0x02, ...payload, 0x03];
  }

  // v2 brightness budget: 18 W total, scaled down in steps until it fits.
  function v2Scale(leds) {
    for (const s of [1.0, 0.8, 0.6, 0.4, 0.2, 0.1, 0.05]) {
      let p = 0;
      for (const { color } of leds) {
        const [r, g, b] = hex(color);
        p += (Math.floor(r * s) >> 6) + (Math.floor(g * s) >> 6) + (Math.floor(b * s) >> 6);
      }
      if (p / 30 <= 18) return s;
    }
    return 0;
  }

  function ledBytes(api, led, scale) {
    const [r, g, b] = hex(led.color), pos = led.position;
    if (api >= 3) return [pos & 0xff, (pos >> 8) & 0xff, ((r >> 5) << 5) | ((g >> 5) << 2) | (b >> 6)];
    const sc = (v) => Math.floor(v * scale) >> 6;
    return [pos & 0xff, (sc(r) << 6) | (sc(g) << 4) | (sc(b) << 2) | ((pos >> 8) & 0x03)];
  }

  // leds: [{position, color:"RRGGBB"}] -> byte array of one or more framed messages
  function encode(leds, api) {
    api = api >= 3 ? 3 : 2;
    const c = CMD[api], scale = api === 2 ? v2Scale(leds) : 1;
    const maxPos = api === 3 ? 65535 : 1023;
    const parts = [[c.cont]];
    for (const led of leds) {
      if (led.position < 0 || led.position > maxPos) continue;
      const bytes = ledBytes(api, led, scale);
      if (parts[parts.length - 1].length + bytes.length > 255) parts.push([c.cont]);
      parts[parts.length - 1].push(...bytes);
    }
    if (parts.length === 1) parts[0][0] = c.single;
    else { parts[0][0] = c.start; parts[parts.length - 1][0] = c.end; }
    return parts.flatMap(wrap);
  }

  // "Name#serial@3" -> 3; no @ -> 2
  function apiLevel(name) {
    const m = /@(\d+)/.exec(name || "");
    return m ? parseInt(m[1], 10) : 2;
  }

  return { encode, apiLevel, checksum, wrap };
})();
if (typeof module !== "undefined") module.exports = AURORA;

</script>

ade":"V8 (7b)","ascents":5,"stars":3.0,"benchmark":false,"frames":"p1097r8p1113r8p1136r6p1144r6p1148r8p1176r7p1209r5p1212r6p1227r6"}]}]};
const ROLE = {5:{name:"start",color:"00FF00"},6:{name:"hand",color:"0000FF"},7:{name:"finish",color:"FF0000"},8:{name:"foot",color:"FF00FF"}};
const AURORA_SVC = "4488b571-7806-4df6-bcff-a2897e4953ff";
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const $ = (id) => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let device = null, rx = null, api = 2, sending = false;
let listIdx = 0, climbIdx = -1;
const litSet = new Set();

function setStatus(t, kind){ const s=$("status"); s.textContent=t; s.className="status"+(kind?" "+kind:""); }
const curList = () => DATA.lists[listIdx];
const curClimb = () => climbIdx>=0 ? curList().climbs[climbIdx] : null;
const layoutOk = () => curList().board === $("layout").value;

function parseFrames(fr){ return [...fr.matchAll(/p(\d+)r(\d+)/g)].map(m=>({pid:m[1], role:+m[2]})); }

// ---------- board map ----------
function drawMap(){
  const b = curList().board, H = DATA.holds[b], svg = $("map");
  const hits = curClimb() ? parseFrames(curClimb().frames) : [];
  const used = new Map(hits.map(h=>[h.pid,h.role]));
  let s = "";
  for (const pid in H){ const [x,y] = H[pid]; s += `<circle cx="${x}" cy="${144-y}" r="1.1" fill="var(--dot)"/>`; }
  for (const [pid,role] of used){
    const p = H[pid]; if (!p) continue;
    const c = ROLE[role] ? `var(--${ROLE[role].name})` : "var(--fg)";
    s += `<circle cx="${p[0]}" cy="${144-p[1]}" r="3.4" fill="none" stroke="${c}" stroke-width="1.4"/>`;
  }
  svg.innerHTML = s;
}

// ---------- lists ----------
function renderLists(){
  $("listSel").innerHTML = DATA.lists.map((l,i)=>`<option value="${i}">${l.title} (${l.climbs.length})</option>`).join("");
  $("listSel").value = listIdx;
}
function renderList(){
  const l = curList();
  $("list").innerHTML = l.climbs.map((c,i)=>`<button class="climb${litSet.has(l.id+":"+i)?" lit":""}" data-i="${i}" aria-current="${i===climbIdx}">
      <span class="n">${i+1}</span><span class="t">${esc(c.name)}${c.benchmark?" ✓":""}</span><span class="g">${c.grade}</span>
      <span class="m">${esc(c.setter)} · ${c.stars.toFixed(2)}★ · ${c.ascents} ascents</span></button>`).join("");
  $("layoutWarn").hidden = layoutOk();
}
function esc(s){ return s.replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function renderCur(){
  const c = curClimb();
  $("cur").innerHTML = c ? `${climbIdx+1}. ${esc(c.name)} <small>· ${c.grade} · ${curList().angle}°</small>` : "Pick a climb";
  $("lightBtn").disabled = !c || !layoutOk() || sending;
  $("lightBtn").textContent = rx ? "Light" : "Connect + light";
  for (const b of $("list").children) b.setAttribute("aria-current", +b.dataset.i===climbIdx ? "true":"false");
  drawMap();
}
function selectClimb(i, light){
  const n = curList().climbs.length; if (!n) return;
  climbIdx = (i+n)%n; renderCur();
  const el = $("list").children[climbIdx]; if (el) el.scrollIntoView({block:"nearest"});
  if (light && rx && layoutOk()) lightCurrent();
}

// ---------- bluetooth ----------
async function connect(){
  if (!navigator.bluetooth){ $("noBle").hidden=false; setStatus("Bluetooth isn't available in this browser.","err"); return false; }
  try {
    if (!device){
      setStatus("Choose your board in the list that opens…");
      device = await navigator.bluetooth.requestDevice({
        filters:[{services:[AURORA_SVC]},{namePrefix:"Tension"}],
        optionalServices:[NUS, AURORA_SVC]
      });
      device.addEventListener("gattserverdisconnected", ()=>{ rx=null; setStatus("Board disconnected. Tap Light to reconnect.","err"); renderCur(); $("connectBtn").textContent="Reconnect"; $("clearBtn").disabled=true; });
    }
    setStatus("Connecting…");
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rx = await svc.getCharacteristic(RX);
    api = AURORA.apiLevel(device.name);
    const mode = rx.properties.write ? "with response" : "without response";
    setStatus(`Connected: ${device.name || "board"} · protocol v${api} · writes ${mode}`, "ok");
    $("connectBtn").textContent = "Connected"; $("clearBtn").disabled = false;
    renderCur();
    return true;
  } catch (e) {
    rx = null;
    if (e && e.name === "NotFoundError") setStatus("No board chosen. Make sure the board is on and nobody else's phone is connected to it.","err");
    else setStatus(`Couldn't connect: ${e && e.message || e}`, "err");
    return false;
  }
}

async function send(bytes){
  // 20-byte writes, one at a time; with-response when the board offers it (safe on iOS).
  const withResp = rx.properties.write;
  for (let i=0;i<bytes.length;i+=20){
    const chunk = new Uint8Array(bytes.slice(i,i+20));
    if (withResp) await (rx.writeValueWithResponse ? rx.writeValueWithResponse(chunk) : rx.writeValue(chunk));
    else await rx.writeValueWithoutResponse(chunk);
  }
}

async function lightCurrent(){
  const c = curClimb(); if (!c || sending) return;
  if (!layoutOk()){ setStatus("This list is for the other layout.","err"); return; }
  if (!rx && !(await connect())) return;
  const map = DATA.leds[curList().board], leds = [];
  let missing = 0;
  for (const {pid, role} of parseFrames(c.frames)){
    const pos = map[pid];
    if (pos === undefined){ missing++; continue; }
    leds.push({position:pos, color:(ROLE[role]||{color:"FFFFFF"}).color});
  }
  sending = true; renderCur();
  try {
    await send(AURORA.encode(leds, api));
    litSet.add(curList().id+":"+climbIdx);
    const el = $("list").children[climbIdx]; if (el) el.classList.add("lit");
    setStatus(`Lit ${c.name}: ${leds.length} holds${missing?`, ${missing} not on a 12×12`:""}.`, "ok");
  } catch (e) {
    setStatus(`Sending failed: ${e && e.message || e}. Tap Light to try again.`, "err");
    rx = null;
  } finally { sending = false; renderCur(); }
}

async function clearBoard(){
  if (!rx || sending) return;
  sending = true;
  try { await send(AURORA.encode([], api)); setStatus("Board cleared.","ok"); }
  catch (e) { setStatus(`Clearing failed: ${e && e.message || e}`,"err"); }
  finally { sending = false; renderCur(); }
}

// ---------- wiring ----------
$("connectBtn").onclick = connect;
$("clearBtn").onclick = clearBoard;
$("lightBtn").onclick = lightCurrent;
$("prevBtn").onclick = ()=>selectClimb(climbIdx<0?0:climbIdx-1, true);
$("nextBtn").onclick = ()=>selectClimb(climbIdx+1, true);
$("list").addEventListener("click", e=>{ const b=e.target.closest(".climb"); if (b) selectClimb(+b.dataset.i, false); });
$("listSel").onchange = ()=>{ listIdx=+$("listSel").value; climbIdx=-1; store.set("list",listIdx); renderList(); renderCur(); };
$("layout").onchange = ()=>{ store.set("layout",$("layout").value); renderList(); renderCur(); };

if (!navigator.bluetooth) $("noBle").hidden = false;
const savedLayout = store.get("layout"); if (savedLayout) $("layout").value = savedLayout;
const savedList = +store.get("list"); if (savedList >= 0 && savedList < DATA.lists.length) listIdx = savedList;
renderLists(); renderList(); renderCur();
</script>
